<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="800" height="6" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4D7EA8" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#4D7EA8" stop-opacity="0.3"/>
      <stop offset="0.85" stop-color="#4D7EA8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4D7EA8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4D7EA8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4D7EA8" stop-opacity="1"/>
      <stop offset="1" stop-color="#4D7EA8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sweep { animation: sweep 5s cubic-bezier(.45, 0, .55, 1) infinite; }
    @keyframes sweep {
      from { transform: translateX(-260px); }
      to { transform: translateX(800px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; transform: translateX(270px); }
    }
  </style>
  <rect x="0" y="2.5" width="800" height="1" fill="url(#base)"/>
  <rect class="sweep" x="0" y="2" width="260" height="2" rx="1" fill="url(#glow)"/>
</svg>
